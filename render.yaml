services:
  # 1. Backend Service (FastAPI)
  - type: web
    name: notpad-backend
    runtime: docker
    # We set rootDir to backend so that Render uses it as build context and tracks changes there
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free # Use the free instance type (or starter if database is attached)
    envVars:
      - key: PORT
        value: 8000
      - key: POSTGRES_HOST
        fromDatabase:
          name: notpad-db
          property: host
      - key: POSTGRES_USER
        fromDatabase:
          name: notpad-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: notpad-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: notpad-db
          property: name
      - key: POSTGRES_PORT
        fromDatabase:
          name: notpad-db
          property: port
      - key: SESSION_SECRET
        generateValue: true
      - key: API_KEY
        value: pUokR5fyjA866Phf32jq
      - key: GROQ_API_KEY
        sync: false # Set this manually in the dashboard

  # 2. Frontend Service (Static Site)
  - type: web
    name: notpad-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      # Rewrites to route API / Auth / Uploads / AI calls to the backend service
      - type: rewrite
        source: /auth/*
        destination: https://notpad-backend.onrender.com/auth/*
      - type: rewrite
        source: /notes/*
        destination: https://notpad-backend.onrender.com/notes/*
      - type: rewrite
        source: /groups/*
        destination: https://notpad-backend.onrender.com/groups/*
      - type: rewrite
        source: /uploads/*
        destination: https://notpad-backend.onrender.com/uploads/*
      - type: rewrite
        source: /ai/*
        destination: https://notpad-backend.onrender.com/ai/*
      # Support Single Page App client-side routing (React Router etc.)
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. Database Service (PostgreSQL)
  - name: notpad-db
    databaseName: mydb
    user: postgres
    plan: free
